llm:
  base_url: "http://localhost:8001/v1"
  api_key: "not-needed"
  model: "./llm_model/qwen3-4b-4bit-mlx"
  max_context_tokens: 32768
  # Alternative model: gpt-oss-20b
  # model_path: ./llm_model/gpt-oss-20b | ./llm_model/qwen3-4b-4bit-mlx

server:
  backend_host: "0.0.0.0"
  backend_port: 8080
  frontend_host: "0.0.0.0"
  frontend_port: 9001
  backend_api_host: "localhost"
  backend_api_port: 8080
  database_path: "data/app.db"
  health_check_interval_seconds: 30
  # http 모드 AXIT invoke 대기 시간(초). nginx proxy_read_timeout 과 맞추는 것을 권장
  agent_runtime_http_timeout_seconds: 3600

# 작업 알림 채널 (환경변수로 오버라이드 가능)
notifications:
  email:
    enabled: false
    smtp_host: ""
    smtp_port: 587
    smtp_username: ""
    smtp_password: ""
    from_address: ""
    use_tls: true
    use_ssl: false
    timeout_seconds: 30
  teams:
    enabled: false
    mode: "webhook"   # webhook | graph
    webhook_url: ""
    tenant_id: ""
    client_id: ""
    client_secret: ""
    team_id: ""
    channel_id: ""
    timeout_seconds: 30

# 시스템 인벤토리 (ChromaDB) - 환경변수로 오버라이드 가능
inventory:
  chroma_data_path: "data/chroma"
  csv_path: "data/inventory/inventory.csv"
  upload_path: "data/inventory/uploads"

# Whatap 이벤트 수신 webhook
whatap:
  webhook_secret: ""

# 통합 채팅 사용자 대화 로그
user_comm_log:
  log_dir: "data/user_comm_logs"
  retention_days: 30

# 작업요청자 데몬 (수동 "테스트 작업 발송"으로 대체됨, 기본 중지)
job_requester:
  enabled: false
  interval_minutes: 60
  initial_delay_seconds: 60

# 승인 완료(status_code=2) 작업을 helpdesk 에이전트에 위임
job_processor:
  enabled: true
  poll_interval_seconds: 60
  initial_delay_seconds: 0
  # http 모드: agentruntime.local_agent_id (기본 helpdesk, 대안 sys-helpdesk)
  helpdesk_local_agent_id: helpdesk
  # http 모드: AXIT agent_id 직접 지정 (선택)
  helpdesk_axit_agent_id: ""

# 나의 노트: Redis 편집 버퍼 → 주기적 파일 영구 저장
mynotes:
  enabled: true
  flush_interval_seconds: 300
  initial_delay_seconds: 0

# Kubernetes/OpenShift 클러스터 수집 (openshift DynamicClient, 동기)
# - 기동 시/스케줄 자동 수집은 중지 (수동 수집 UI 사용)
# - schedule_enabled 를 true 로 켜면 매일 00:10 부터 등록 순서대로 5분 간격 재개
k8s_collector:
  enabled: true
  collect_on_startup: false
  schedule_enabled: false
  schedule_hour: 0
  schedule_minute: 10
  stagger_minutes: 5
  # Deployed path; if missing, collector uses local kubeconfig (KUBECONFIG/~/.kube/config)
  kubeconfig: /etc/k8s-kubeconfig/k8s-kubeconfig
  fallback_to_current_context: true
  # contexts:
  #   dtest-k8s: orbstack

# 인증 프로바이더 (환경변수 AUTH_PROVIDER_TYPE / OAUTH_PROXY 로 오버라이드)
auth:
  provider_type: "db"   # db | madang
  oauth_proxy: ""

# Redis (세션·캐시, 배포 시 별도 프로세스 — 패키징하지 않음)
redis:
  url: "redis://localhost:6379/0"

# Bearer 세션 (B-2): 슬라이딩 TTL + 절대 상한
auth_session:
  ttl_seconds: 3600
  absolute_max_seconds: 28800
