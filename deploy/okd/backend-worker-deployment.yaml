apiVersion: apps/v1
kind: Deployment
metadata:
  name: ax-backend-worker
  labels:
    app: ax-platform
    component: backend-worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ax-platform
      component: backend-worker
  template:
    metadata:
      labels:
        app: ax-platform
        component: backend-worker
    spec:
      containers:
        - name: worker
          image: ora01000/project-a-backend:pg260814
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: BACKEND_ROLE
              value: worker
            - name: BACKEND_HOST
              value: "0.0.0.0"
            - name: AGENT_RUNTIME_MODE
              valueFrom:
                configMapKeyRef:
                  name: ax-platform-config
                  key: AGENT_RUNTIME_MODE
            - name: MY_NOTES_CONTENT_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: ax-platform-config
                  key: MY_NOTES_CONTENT_BACKEND
            - name: USER_COMM_LOG_BACKEND
              valueFrom:
                configMapKeyRef:
                  name: ax-platform-config
                  key: USER_COMM_LOG_BACKEND
            - name: TZ
              valueFrom:
                configMapKeyRef:
                  name: ax-platform-config
                  key: TZ
                  optional: true
            - name: RECEIVED_MAIL_ATTACHMENT_HOME
              valueFrom:
                configMapKeyRef:
                  name: ax-platform-config
                  key: RECEIVED_MAIL_ATTACHMENT_HOME
                  optional: true
            - name: RECEIVED_MAIL_POLL_INTERVAL_SECONDS
              valueFrom:
                configMapKeyRef:
                  name: ax-platform-config
                  key: RECEIVED_MAIL_POLL_INTERVAL_SECONDS
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ax-platform-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ax-platform-secrets
                  key: REDIS_URL
            - name: AGENT_RUNTIME_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ax-platform-secrets
                  key: AGENT_RUNTIME_API_KEY
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: kubeconfig
              mountPath: /etc/k8s
              readOnly: true
      volumes:
        - name: kubeconfig
          secret:
            secretName: ax-k8s-kubeconfig
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: ax-backend-worker
  labels:
    app: ax-platform
    component: backend-worker
spec:
  selector:
    app: ax-platform
    component: backend-worker
  ports:
    - name: http
      port: 8080
      targetPort: http
