# Example Secret — copy to secrets.yaml and fill (do not commit real values).
apiVersion: v1
kind: Secret
metadata:
  name: ax-platform-secrets
  labels:
    app: ax-platform
type: Opaque
stringData:
  DATABASE_URL: "postgresql://ax:CHANGE_ME@postgresql:5432/ax_platform"
  REDIS_URL: "redis://redis:6379/0"
  AGENT_RUNTIME_API_KEY: ""
  WHATAP_WEBHOOK_SECRET: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ax-platform-config
  labels:
    app: ax-platform
data:
  AGENT_RUNTIME_MODE: "http"
  BACKEND_HOST: "0.0.0.0"
  MY_NOTES_CONTENT_BACKEND: "database"
  USER_COMM_LOG_BACKEND: "stdout"
  TZ: "Asia/Seoul"
  RECEIVED_MAIL_ATTACHMENT_HOME: "/var/lib/ax-platform/received-mail"
  RECEIVED_MAIL_POLL_INTERVAL_SECONDS: "30"
